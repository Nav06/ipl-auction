/* ===== Marquee First + Classic IPL Sets (10-20 players per set) ===== */
function buildPoolWithSets(){
 const all=POOL.split("\n").map((l,i)=>{const[n,c,r,b,src]=l.split("|");return{id:"P"+String(i+1).padStart(3,"0"),n,c,o:c!=="IND",r,b:+b,src,st:"pool",tm:null,pr:0}});
 const marqueeItems=all.filter(p=>MARQUEE_NAMES.has(p.n));
 const remaining=all.filter(p=>!MARQUEE_NAMES.has(p.n));
 const tiers=[
  {label:"₹2 Cr",fn:p=>p.b>=200},
  {label:"₹1–1.5 Cr",fn:p=>p.b>=100&&p.b<200},
  {label:"₹75 L",fn:p=>p.b===75},
  {label:"≤₹50 L",fn:p=>p.b<=50}
 ];
 const roleOrder=["B","K","A","P","T"];
 const buckets=[];
 tiers.forEach(t=>{
  roleOrder.forEach(r=>{
   const items=remaining.filter(p=>t.fn(p)&&p.r===r).sort((a,b)=>b.b-a.b||a.n.localeCompare(b.n));
   if(items.length)buckets.push({tier:t.label,roles:[r],items});
  });
 });
 const merged=[];
 let cur=null;
 for(const b of buckets){
  if(!cur){cur={tier:b.tier,roles:[...b.roles],items:[...b.items]};continue}
  if(cur.items.length<10&&(cur.tier===b.tier||cur.items.length+b.items.length<=20)){
   if(cur.tier!==b.tier)cur.tier=cur.tier+" / "+b.tier;
   b.roles.forEach(r=>{if(!cur.roles.includes(r))cur.roles.push(r)});
   cur.items.push(...b.items);
  }else{
   merged.push(cur);
   cur={tier:b.tier,roles:[...b.roles],items:[...b.items]};
  }
 }
 if(cur){
  if(cur.items.length<10&&merged.length&&merged[merged.length-1].items.length+cur.items.length<=22){
   const prev=merged[merged.length-1];
   if(prev.tier!==cur.tier)prev.tier=prev.tier+" / "+cur.tier;
   cur.roles.forEach(r=>{if(!prev.roles.includes(r))prev.roles.push(r)});
   prev.items.push(...cur.items);
  }else merged.push(cur);
 }
 const finalSets=[{name:"Marquee Set",items:marqueeItems}];
 merged.forEach(b=>{
  const rLabel=b.roles.map(r=>RSHORT[r]||r).join(" & ");
  const baseName=`${b.tier} · ${rLabel}`;
  const total=b.items.length;
  if(total<=20){
   finalSets.push({name:baseName,items:b.items});
  }else{
   const nChunks=Math.ceil(total/16);
   const size=Math.ceil(total/nChunks);
   for(let i=0;i<nChunks;i++){
    const slice=b.items.slice(i*size,(i+1)*size);
    if(slice.length)finalSets.push({name:`${baseName} (Set ${i+1})`,items:slice});
   }
  }
 });
 let ord=0;
 const out={};
 finalSets.forEach(s=>{
  s.items.forEach(p=>{
   out[p.id]={n:p.n,c:p.c,o:p.o,r:p.r,b:p.b,src:p.src,set:s.name,ord:ord++,st:"pool",tm:null,pr:0};
  });
 });
 return out;
}

/* ===== Chunked Pool Storage (2 docs; fetched on-demand by auctioneer) ===== */
async function ensurePoolLoaded(){
 if(Object.keys(P).length)return P;
 poolLoading=true;render();
 try{
  const q=await db.collection("pool").get();
  CHUNKS={};P={};
  q.docs.forEach(x=>{const m=(x.data()&&x.data().map)||{};CHUNKS[x.id]=m;Object.assign(P,m)});
  return P;
 }finally{poolLoading=false;render()}
}
async function savePoolAll(obj){
 P=obj;
 const ids=Object.keys(obj).sort();
 const b=db.batch();
 const chunks={};
 for(let i=0;i<ids.length;i+=CHUNK){
  const cid="c"+Math.floor(i/CHUNK);
  const map={};
  ids.slice(i,i+CHUNK).forEach(id=>map[id]=obj[id]);
  chunks[cid]=map;
  b.set("pool/"+cid,{map});
 }
 Object.keys(CHUNKS).forEach(cid=>{if(!chunks[cid])b.delete("pool/"+cid)});
 CHUNKS=chunks;
 await b.commit();
}
async function updatePlayer(id,patch){
 await ensurePoolLoaded();
 if(!P[id])return;
 P[id]={...P[id],...patch};
 const ids=Object.keys(P).sort();
 const idx=ids.indexOf(id);
 const cid="c"+Math.floor(Math.max(0,idx)/CHUNK);
 await db.doc("pool/"+cid).update({["map."+id]:P[id]});
}
async function updatePlayersBatch(patches){
 await ensurePoolLoaded();
 const cids=new Set();
 const ids=Object.keys(P).sort();
 Object.entries(patches).forEach(([id,patch])=>{
  if(!P[id])return;
  P[id]={...P[id],...patch};
  const idx=ids.indexOf(id);
  cids.add("c"+Math.floor(Math.max(0,idx)/CHUNK));
 });
 const b=db.batch();
 cids.forEach(cid=>{
  const i=Number(cid.slice(1))*CHUNK;
  const map={};
  ids.slice(i,i+CHUNK).forEach(id=>map[id]=P[id]);
  b.set("pool/"+cid,{map});
 });
 await b.commit();
}

const parseSq=str=>(str||"").split(",").filter(Boolean).map(raw=>{const[n,r="?",f=""]=raw.split("|");return{raw,n,r,f,o:f.includes("O")}});
function getRoster(id){const t=TM[id];if(!t)return[];
 const ret=parseSq(t.sq).map((x,i)=>({key:"R:"+i+":"+x.raw,type:"ret",n:x.n,o:x.o,raw:x.raw,pr:0}));
 const bgt=(t.bought||[]).map(b=>{const p=P[b.id]||{};return{key:"B:"+b.id,type:"bgt",id:b.id,n:b.n,o:!!p.o,pr:b.pr}});
 return[...ret,...bgt]}
function evalTrade(){
 const tA=TM[TR.a],tB=TM[TR.b];if(!tA||!tB||TR.a===TR.b)return{err:"Pick two different teams"};
 const rA=getRoster(TR.a),rB=getRoster(TR.b);
 const sendA=rA.filter(x=>TR.sa.has(x.key)),sendB=rB.filter(x=>TR.sb.has(x.key));
 const val=Math.max(0,Math.round(Number(TR.val)||0));
 if(!sendA.length&&!sendB.length&&val===0)return{err:"Select players and/or enter a purse adjustment"};
 const dPurseA=TR.dir==="ab"?-val:val;
 const dPurseB=-dPurseA;
 const osOutA=sendA.filter(x=>x.o).length,osInA=sendB.filter(x=>x.o).length;
 const osOutB=sendB.filter(x=>x.o).length,osInB=sendA.filter(x=>x.o).length;
 const newSlA=tA.sl+sendA.length-sendB.length;
 const newSlB=tB.sl+sendB.length-sendA.length;
 const newOsA=tA.os+osOutA-osInA;
 const newOsB=tB.os+osOutB-osInB;
 const newPuA=tA.pu+dPurseA;
 const newPuB=tB.pu+dPurseB;
 let err="";
 if(!S||S.ph!=="paused")err="Pause the auction first to execute trades";
 else if(newSlA<0)err=TR.a+" exceeds squad slot limit ("+newSlA+" slots left)";
 else if(newSlB<0)err=TR.b+" exceeds squad slot limit ("+newSlB+" slots left)";
 else if(newOsA<0)err=TR.a+" exceeds overseas limit ("+newOsA+" OS slots left)";
 else if(newOsB<0)err=TR.b+" exceeds overseas limit ("+newOsB+" OS slots left)";
 else if(newPuA<newSlA*MINB)err=TR.a+" lacks minimum purse ("+cr(newPuA)+" < "+cr(newSlA*MINB)+" needed)";
 else if(newPuB<newSlB*MINB)err=TR.b+" lacks minimum purse ("+cr(newPuB)+" < "+cr(newSlB*MINB)+" needed)";
 return{err,tA,tB,sendA,sendB,val,dPurseA,dPurseB,newSlA,newSlB,newOsA,newOsB,newPuA,newPuB}}
