const BASE={S:200,M:100,U:30}, ROLE={B:"Batter",K:"Keeper",A:"All-rounder",P:"Bowler",T:"Role TBC"};
const $=s=>document.querySelector(s), e=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const cr=l=>"₹"+(+(l/100).toFixed(2))+" cr", inc=l=>l<100?10:l<200?20:l<500?25:50;
let db,me,adm=false,own=false,eng=false,PINH="",SV="",rc=0,rc2=0,PK="",TAB=Math.random().toString(36).slice(2),S=null,P={},TM={},CL={},BD={},LG=[],busy=false;const OPEN=new Set(["pool-Up next"]);

function chk(tm,p,amt){const t=TM[tm];if(!t)return"No team";if(S&&S.bt===tm)return"You lead";if(t.sl<=0)return"Squad full";
 if(p.o&&t.os<=0)return"No overseas slot";if(amt>t.pu-(t.sl-1)*MINB)return"Not enough purse";return""}
const need=()=>S.bt?S.bid+inc(S.bid):P[S.pid].b;

const ords=()=>Object.values(P).map(p=>p.ord);

const par=async(a,f,n=10)=>{for(let i=0;i<a.length;i+=n)await Promise.all(a.slice(i,i+n).map((x,j)=>f(x,i+j)))};
const loadPlayers=()=>par(POOL.split("\n"),(l,i)=>{const[n,c,r,b,src]=l.split("|");return db.doc("players/P"+String(i+1).padStart(3,"0")).set({n,c,o:c!=="IND",r,b:+b,src,ord:i,st:"pool",tm:null,pr:0})});
async function init(){
 $("#ib").disabled=true;await loadPlayers();
 await par(TEAMS,([id,n,c,pu,sl,os,sq])=>db.doc("teams/"+id).set({n,c,pu,sl,os,sq,bought:[]}));
 await setS({ph:"idle",pid:null,bid:0,bt:null,end:0,left:0,nb:0,until:0});
}
async function restart(){
 if(!rc2){rc2=1;setTimeout(()=>rc2=0,4000);return note("Tap Restart again to wipe all results and start over")}rc2=0;
 await setS({ph:"idle",pid:null,bid:0,bt:null,end:0,left:0,nb:0,until:0,rid:Date.now()});
 await par(Object.keys(P),id=>db.doc("players/"+id).delete());
 await par(LG.map(l=>l.id),id=>db.doc("log/"+id).delete());
 await par(Object.keys(BD),id=>db.doc("bids/"+id).delete().catch(()=>{}));
 await par(TEAMS,([id,n,c,pu,sl,os,sq])=>db.doc("teams/"+id).set({n,c,pu,sl,os,sq,bought:[]}));
 await loadPlayers();note("Auction restarted")}
async function pick(){const id=PK,p=P[id];
 if(!p)return note("Search and select a player first");
 if(p.st==="sold")return note("That player is already sold");
 if(S.ph==="live"&&S.bt)return note("Current player has a bid, let the hammer fall first");
 if(p.st!=="pool")await db.doc("players/"+id).update({st:"pool"});
 await setS({ph:"live",pid:id,bid:0,bt:null,end:Date.now()+CLK*1000,left:0,nb:0,until:0,rid:S.rid||0});
 await lg({k:"pick",t:"Auctioneer put "+p.n+" on the block"})}
function fillPick(){const box=$("#pk");if(!box)return;const q=($("#sq").value||"").toLowerCase();
 const m=Object.entries(P).filter(([,p])=>p.st!=="sold"&&p.n.toLowerCase().includes(q)).sort((a,b)=>a[1].ord-b[1].ord).slice(0,8);
 box.innerHTML=m.map(([id,p])=>`<button data-p="${id}" style="${id===PK?"outline:2px solid var(--ac)":""}">${p.o?"✈":"🇮🇳"} ${e(p.n)} · ${cr(p.b)}${p.st==="unsold"?" · unsold":""}</button>`).join("")||"<span class=mu>No match</span>";
 box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{PK=b.dataset.p;fillPick()});
 $("#psel").textContent=PK&&P[PK]?"Selected: "+P[PK].n:"Nothing selected"}
function fillRel(){const el=$("#rl");if(!el)return;const c=Object.entries(CL);
 el.innerHTML=c.length?c.map(([u,x])=>`<button data-r="${e(u)}">${e(x.tm)} ✕</button>`).join(" "):"<span class=mu>No teams claimed</span>";
 el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>db.doc("claims/"+b.dataset.r).delete())}
async function reload(){
 if(S.ph==="live"||Object.values(P).some(p=>p.st==="sold"))return note("Only possible before the first sale, with the auction paused or idle");
 if(!rc){rc=1;setTimeout(()=>rc=0,4000);return note("Tap Reload pool again to confirm")}rc=0;
 await par(Object.keys(P),id=>db.doc("players/"+id).delete());await loadPlayers();await setS({...S,ph:"idle",pid:null,bid:0,bt:null})}
async function startNext(){const q=pool();if(!q.length)return setS({...S,ph:"done",pid:null});
 await setS({ph:"live",pid:q[0][0],bid:0,bt:null,end:Date.now()+CLK*1000,left:0,nb:0,until:0,rid:S.rid||0})}
async function processBids(){
 if(busy||!eng||!S||S.ph!=="live")return;busy=true;
 try{for(;;){const p=P[S.pid],n=need();
  const c=Object.values(BD).filter(b=>b.pid===S.pid&&(b.rid||0)===(S.rid||0)&&b.amt===n&&!chk(b.tm,p,n)).sort((a,b)=>a.ts-b.ts)[0];
  if(!c)break;await setS({...S,bid:n,bt:c.tm,end:Date.now()+CLK*1000,nb:S.nb+1})}}finally{busy=false}}
async function settle(){
 if(busy)return;busy=true;
 try{const id=S.pid,p=P[id];
  if(S.bt){const t=TM[S.bt];
   await db.doc("players/"+id).update({st:"sold",tm:S.bt,pr:S.bid});
   await db.doc("teams/"+S.bt).update({pu:t.pu-S.bid,sl:t.sl-1,os:t.os-(p.o?1:0),bought:[...(t.bought||[]),{id,n:p.n,pr:S.bid}]});
   await lg({k:"sold",pid:id,tm:S.bt,pr:S.bid,t:p.n+" → "+S.bt+" for "+cr(S.bid)})}
  else{await db.doc("players/"+id).update({st:"unsold"});await lg({k:"unsold",t:p.n+" went unsold"})}
  await setS({...S,ph:"break",until:Date.now()+BRK})}finally{busy=false}}
async function bid(){
 if(!S||S.ph!=="live"||!CL[me])return;const p=P[S.pid],amt=need();
 if(chk(CL[me].tm,p,amt))return;await db.doc("bids/"+me).set({tm:CL[me].tm,pid:S.pid,amt,rid:S.rid||0,ts:Date.now()})}
const A={
 async start(){if(S.ph==="paused")await setS({...S,ph:"live",end:Date.now()+S.left});else await startNext()},
 async pause(){if(S.ph==="live")await setS({...S,ph:"paused",left:Math.max(0,S.end-Date.now())})},
 async skip(){if(S.ph!=="live")return;const id=S.pid,o=Math.max(...ords())+1;P[id]={...P[id],ord:o};await db.doc("players/"+id).update({ord:o});await lg({k:"skip",t:P[id].n+" skipped (back of queue)"});await startNext()},
 async undo(){if(S.ph==="live")return note("Pause the auction first");
  const l=LG.filter(x=>x.k==="sold"&&!x.un)[0];if(!l)return;const p=P[l.pid],t=TM[l.tm];
  await db.doc("teams/"+l.tm).update({pu:t.pu+l.pr,sl:t.sl+1,os:t.os+(p.o?1:0),bought:(t.bought||[]).filter(b=>b.id!==l.pid)});
  await db.doc("players/"+l.pid).update({st:"pool",tm:null,pr:0,ord:Math.min(...ords())-1});
  await db.doc("log/"+l.id).update({un:true});await lg({k:"undo",t:"UNDO: "+p.n+" returned to pool, "+cr(l.pr)+" refunded to "+l.tm})},
 reload,restart,pick,
 async add(){const n=$("#an").value.trim();if(!n)return;
  await db.doc("players/p"+Date.now()).set({n,o:$("#ao").value==="O",r:$("#ar").value,b:+$("#ab").value,ord:Math.max(...ords())+1,st:"pool",tm:null,pr:0});
  await lg({k:"add",t:"Added to pool: "+n});$("#an").value=""}};

function render(){
 $("#msg").hidden=true;$("#app").hidden=false;$("#adm").hidden=!adm;$("#mst1").hidden=adm;$("#mst2").hidden=!adm;$("#mm").textContent=adm?(eng?"This device runs the clock":"Another master device runs the clock"):(PINH?"":"No host PIN yet: the first person to set one becomes the host. Host, do this before sharing the link.");$("#pu").textContent=PINH?"Unlock":"Set host PIN";
 if(adm){renderAdm();fillPick();fillRel()}
 const my=CL[me]&&CL[me].tm;let h="";
 if(!S){h="<div class=mu>Auction not set up yet.</div>"+(adm?"<button id=ib class=p>Initialise IPL 2027 auction</button>":"")}
 else{const p=P[S.pid],lt=LG[0];
  if(S.ph==="idle")h="<div class=big>Waiting for the auctioneer…</div>";
  else if(S.ph==="done")h="<div class=big>Auction complete 🏆</div>";
  else if(S.ph==="break")h=lt&&lt.k==="sold"?`<div class=sold>SOLD! 🔨</div><div>${e(lt.t)}</div>`:`<div class=big>${lt?e(lt.t):""}</div>`;
  else if(p){const lead=S.bt?TM[S.bt]:null,n=need(),er=my?chk(my,p,n):"Claim a team below";
   h=`<div class=row><div><div class=mu>${S.ph==="paused"?"⏸ PAUSED":"ON THE BLOCK"} · ${p.o?"✈ Overseas":"🇮🇳 Indian"} · ${ROLE[p.r]}</div><div class=big>${e(p.n)}</div><div class=mu>Base ${cr(p.b)}</div></div><div id=clk></div></div>
   <div class=t style="--k:${lead?lead.c:"var(--ln)"}"><div class=mu>${lead?"Highest bid":"No bids yet"}</div><div class=big>${S.bt?cr(S.bid)+" · "+S.bt:"—"}</div></div>
   <button id=bb class=p ${er||S.ph!=="live"?"disabled":""}>${my?(er&&S.ph==="live"?e(er):"BID "+cr(n)+" as "+my):"Pick your team below"}</button>`}}
 const chips=`<div class=chips>${TEAMS.map(([id,,c])=>{const k=Object.values(CL).some(x=>x.tm===id);return`<button class=chip data-t="${id}" style="--k:${c}" ${k?"disabled":""}>${id}${k?" ✓":""}</button>`}).join("")}</div>`;
 if(!my)h+=adm?`<details data-d="claim" ${OPEN.has("claim")?"open":""} style="margin-top:10px"><summary class=mu>Play as a team (optional)</summary>${chips}</details>`:`<h3 style="margin-top:12px">Claim your team</h3>`+chips;
 else h+=`<div class=row style="margin-top:8px"><span class=mu>You are ${my}</span><button id=lv>Leave team</button></div>`;
 $("#top").innerHTML=h;
 if($("#lv"))$("#lv").onclick=()=>db.doc("claims/"+me).delete();
 if($("#ib"))$("#ib").onclick=init;if($("#bb"))$("#bb").onclick=bid;
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>db.doc("claims/"+me).set({tm:b.dataset.t}));
 $("#teams").innerHTML=Object.entries(TM).map(([id,t])=>{const bt=(t.bought||[]);return`<details class=t style="--k:${t.c}" data-d="${id}" ${OPEN.has(id)?"open":""}><summary><b>${id}</b> · ${cr(t.pu)} · ${t.sl} slots · ${t.os} OS</summary><div class=mu><b>Bought:</b> ${bt.length?bt.map(b=>e(b.n)+" "+cr(b.pr)).join(", "):"—"}<br><b>Retained:</b> ${e(t.sq)}</div></details>`}).join("");
 document.querySelectorAll("[data-d]").forEach(d=>d.ontoggle=()=>d.open?OPEN.add(d.dataset.d):OPEN.delete(d.dataset.d));
 $("#log").innerHTML=LG.slice(0,25).map(l=>`<div class="lg ${l.un?"un":""}">${e(l.t)}</div>`).join("")||"<span class=mu>Nothing yet</span>";
 const pl=Object.values(P).sort((a,b)=>a.ord-b.ord),row=p=>`<div class=lg>${p.o?"✈":"🇮🇳"} ${e(p.n)} <span class=mu>${p.c||""} · ${ROLE[p.r]}${p.src?" · "+p.src:""} · ${cr(p.b)}${p.st==="sold"?" · SOLD "+p.tm+" "+cr(p.pr):p.st==="unsold"?" · unsold":""}</span></div>`,
 grp=(t,f)=>{const a=pl.filter(f);return`<details data-d="pool-${t}" ${OPEN.has("pool-"+t)?"open":""}><summary><b>${t}</b> (${a.length})</summary>${a.map(row).join("")}</details>`};
 $("#pool").innerHTML=grp("Up next",p=>p.st==="pool")+grp("Sold",p=>p.st==="sold")+grp("Unsold",p=>p.st==="unsold");
 document.querySelectorAll("#pool [data-d]").forEach(d=>d.ontoggle=()=>d.open?OPEN.add(d.dataset.d):OPEN.delete(d.dataset.d));
 tick()}
function renderAdm(){const a=$("#adm");if(a.dataset.r)return;a.dataset.r=1;
 a.innerHTML=`<h3>Auctioneer controls</h3><div class=chips><button id=a1>▶ Start / Resume</button><button id=a2>⏸ Pause</button><button id=a3>⏭ Skip player</button><button id=a4>↩ Undo last sale</button><button id=a6>🔄 Reload pool</button><button id=a7>♻ Restart auction</button></div>
 <details style="margin-top:8px"><summary>🎯 Pick a player to auction now</summary><input id=sq placeholder="Search player name"><div id=pk class=chips></div><div id=psel class=mu></div><button id=a8 class=p style="font-size:15px">Auction selected player now</button></details>

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ipl27:"+s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
function note(m){const n=$("#nt");n.textContent=m;n.hidden=false;clearTimeout(note.t);note.t=setTimeout(()=>n.hidden=true,3500)}
function setAdm(){adm=own||(!!PINH&&SV===PINH);lease();render()}
async function lease(){const was=eng;eng=false;if(adm)try{eng=!!(await db.doc("cfg/engine").acquire({holder:me+TAB,ttlMs:12000})).acquired}catch{}if(eng!==was)render()}
async function unlock(){const v=$("#pn").value.trim();
 if(!PINH){if(!/^\d{4,8}$/.test(v))return note("PIN must be 4 to 8 digits");const h=await sha(v);await db.doc("cfg/pin").set({h});SV=h;try{localStorage.setItem("m27",h)}catch{}$("#pn").value="";return note("Host PIN set. You are the host")}
 const h=await sha(v);if(h!==PINH)return note("Wrong PIN");SV=h;try{localStorage.setItem("m27",h)}catch{}$("#pn").value="";setAdm()}
async function setPin(){const v=$("#np").value.trim();if(!/^\d{4,8}$/.test(v))return note("PIN must be 4 to 8 digits");const h=await sha(v);await db.doc("cfg/pin").set({h});SV=h;try{localStorage.setItem("m27",h)}catch{}$("#np").value="";note("PIN saved")}
function tick(){
 if(!S)return;const now=Date.now();
 const c=$("#clk");if(c){const ms=S.ph==="paused"?S.left:S.end-now,s=Math.max(0,Math.ceil(ms/1000));c.textContent=s+"s";c.className=s<=10?"low":""}
 if(!eng||busy)return;
 if(S.ph==="live"&&now>=S.end)settle();else if(S.ph==="break"&&now>=S.until)startNext()}

(async()=>{

 $("#pu").onclick=unlock;$("#ps").onclick=setPin;setAdm();setInterval(tick,500);setInterval(lease,4000);
